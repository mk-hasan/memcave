name: Bug
description: A defect in memcave behavior
title: "[bug] "
body:
  - type: textarea
    attributes:
      label: What happened
      description: Include the command, the backend (memory, sqlite, or postgres), and the error. Do not paste secrets or real personal data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What you expected
    validations:
      required: true

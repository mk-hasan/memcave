[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memcave"
version = "0.1.0.dev0"
description = "Framework-independent persistent memory for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "M.k Hasan" }]
keywords = ["agents", "memory", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
openai = ["openai>=1.40"]
dashboard = ["streamlit>=1.36"]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
all = [
    "memcave[postgres,langgraph,openai,dashboard,dev]",
]

[project.scripts]
memcave = "memcave.cli.app:main"

[project.urls]
Homepage = "https://github.com/mk-hasan/memcave"
Repository = "https://github.com/mk-hasan/memcave"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memcave = ["py.typed", "evaluation/fixtures/*.json", "db/migrations/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008", "ASYNC240", "ASYNC221"]
"src/memcave/cli/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "memcave.domain",
    "memcave.ports",
    "memcave.services",
    "memcave.dreamflow",
    "memcave.evaluation",
]
warn_unused_ignores = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "postgres: requires a PostgreSQL database with pgvector",
]
addopts = "-m 'not postgres'"

[tool.coverage.run]
branch = true
source = [
    "memcave.domain",
    "memcave.ports",
    "memcave.services",
    "memcave.dreamflow",
    "memcave.evaluation",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
